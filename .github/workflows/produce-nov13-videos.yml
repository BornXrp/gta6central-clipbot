name: GTA6Central Nov13 three distinct trailer cuts
on:
  push:
    paths:
      - '.github/workflows/produce-nov13-videos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-video:
    name: Render ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vice_City_Nightlife
            url: https://media-rockstargames-com.akamaized.net/VI/downloads/videos/GTAVI_Trailer_1/GTAVI_Trailer_1.mp4
            start: 42
            duration: 20
            hook: VICE CITY NEVER SLEEPS
          - name: Jason_Lucia_Story
            url: https://media-rockstargames-com.akamaized.net/VI/downloads/videos/GTAVI_Trailer_2/GTAVI_Trailer_2.mp4
            start: 72
            duration: 20
            hook: JASON AND LUCIA IN TOO DEEP
          - name: Fresh_PreLoad_Footage
            url: https://media-rockstargames-com.akamaized.net/VI/downloads/videos/GTAVI_Pre-Load_Now/GTAVI_Pre-Load_Now.mp4
            start: 3
            duration: 20
            hook: GTA VI ONE WEEK TO GO
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render authentic source footage and capture QA
        shell: bash
        env:
          SOURCE_URL: ${{ matrix.url }}
          START: ${{ matrix.start }}
          DURATION: ${{ matrix.duration }}
          POST_NAME: ${{ matrix.name }}
          HOOK: ${{ matrix.hook }}
        run: |
          set -euo pipefail
          mkdir -p render/preview
          # FFmpeg uses HTTP range requests to seek and avoid downloading 0.25–1.3 GB masters.
          URL="${SOURCE_URL}"
          HEADER=$'Referer: https://www.rockstargames.com/\r\nOrigin: https://www.rockstargames.com\r\nUser-Agent: Mozilla/5.0\r\n'
          echo "Rendering source $URL interval ${START}-$(python -c "import os;print(int(os.environ['START'])+int(os.environ['DURATION']))")"
          ffmpeg -hide_banner -v error -y -ss "$START" -headers "$HEADER" -i "$URL" -t "$DURATION" \
            -filter_complex "[0:v]split=2[vbg][vfg];[vbg]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,boxblur=18:2[bg];[vfg]scale=720:1280:force_original_aspect_ratio=decrease[fg];[bg][fg]overlay=(main_w-overlay_w)/2:(main_h-overlay_h)/2:shortest=1,fps=30,format=yuv420p,drawbox=x=0:y=90:w=720:h=90:color=black@0.5:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='$HOOK':x=(w-text_w)/2:y=115:fontsize=26:fontcolor=white:borderw=2:bordercolor=0x020219[v]" \
            -map "[v]" -map 0:a:0 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart "render/${POST_NAME}.mp4"
          python - <<'PY'
          import os,json,subprocess,pathlib
          p=pathlib.Path('render')/(os.environ['POST_NAME']+'.mp4')
          a=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size:stream=codec_type,width,height','-of','json',str(p)]))
          secs=float(a['format']['duration'])
          assert 18<=secs<=20.8,secs
          assert any(s['codec_type']=='audio' for s in a['streams'])
          assert any(s.get('width')==720 and s.get('height')==1280 for s in a['streams'])
          meta={'name':os.environ['POST_NAME'],'source_url':os.environ['SOURCE_URL'],'start':int(os.environ['START']),'duration':secs,'size_bytes':p.stat().st_size,'audio':True,'published':False,'qa':'basic metadata verified; footage/audio still require human review'}
          (pathlib.Path('render')/'report.json').write_text(json.dumps(meta,indent=2))
          print('RENDER_OK',json.dumps(meta),flush=True)
          PY
          for SEC in 2 6 10 14 18; do
            ffmpeg -hide_banner -v error -y -ss "$SEC" -i "render/${POST_NAME}.mp4" -frames:v 1 -vf scale=360:640 "render/preview/${POST_NAME}_${SEC}.jpg"
          done
          ffmpeg -hide_banner -i "render/${POST_NAME}.mp4" -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' || true
      - name: Save exact video and previews for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-nov13-${{ matrix.name }}
          path: render/
          retention-days: 7
          if-no-files-found: warn
